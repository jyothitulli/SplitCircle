<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Theme flash prevention (must run synchronously before paint) -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('sc_theme');
          var t = s === 'light' || s === 'dark' ? s : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <!-- Premium typography: Cabinet Grotesk (display) + Satoshi (body) -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link
      href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,700,500,400&f[]=satoshi@400,500,700,900&display=swap"
      rel="stylesheet"
    />

    <!-- PWA primary -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7C5CFC" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SplitCircle" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%237C5CFC'/><stop offset='55%25' stop-color='%2322D3EE'/><stop offset='100%25' stop-color='%23F472B6'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='%2308090D'/><circle cx='42' cy='44' r='20' fill='none' stroke='url(%23g)' stroke-width='7'/><circle cx='58' cy='56' r='20' fill='none' stroke='url(%23g)' stroke-width='7' opacity='0.6'/></svg>" />

    <!-- SEO / social -->
    <title>SplitCircle — Intelligence for shared living</title>
    <meta name="description" content="A living intelligence layer for shared finances — fairness scoring, conflict prediction, and beautiful settlement flows for circles of friends, roommates, and teams." />
    <meta name="keywords" content="expense splitting, shared finances, roommate expenses, bill splitting, group payments, fairness score" />

    <!-- Open Graph -->
    <meta property="og:title" content="SplitCircle" />
    <meta property="og:description" content="Intelligence for shared living" />
    <meta property="og:type" content="website" />

    <!-- Theme colors per scheme -->
    <meta name="theme-color" content="#F5F4FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08090D" media="(prefers-color-scheme: dark)" />

    <!-- Windows tile -->
    <meta name="msapplication-TileColor" content="#7C5CFC" />
    <meta name="msapplication-TileImage" content="/icons/icon-192.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
